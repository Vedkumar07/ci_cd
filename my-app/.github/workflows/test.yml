name: Deploy Next.js to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1
        with:
          host: 54.167.127.38
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          script: ./deploy.sh