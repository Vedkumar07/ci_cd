name: Deploy Next.js to EC2

on:
  workflow_run:
    workflows:
      - "CI for Next.js App"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Copy app files to EC2
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: ".next,public,package.json,package-lock.json,next.config.ts,postcss.config.mjs,tsconfig.json"
          target: ${{ secrets.APP_DIR }}

      - name: Install production dependencies and restart app on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            cd "${{ secrets.APP_DIR }}"
            npm ci --omit=dev
            pm2 restart "${{ secrets.PM2_APP_NAME }}" || pm2 start npm --name "${{ secrets.PM2_APP_NAME }}" -- start
