name: POC-2 CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: poc-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: my-app/package-lock.json
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-poc.txt
      - uses: azure/setup-helm@v4.3.1
        with: {version: v3.19.0}
      - name: Tests and configuration drift
        run: |
          python -m unittest discover -s tests -v
          helm lint deploy/helm/ci-cd
          python scripts/poc/drift.py
      - run: npm ci
        working-directory: my-app
      - run: npm run lint && npm run typecheck && npm run build
        working-directory: my-app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: config-evidence
          path: artifacts/
          retention-days: 7
  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ci-cd-poc:${{ github.sha }} .
  failure-report:
    timeout-minutes: 10
    needs: [verify, docker]
    if: ${{ always() && !cancelled() && contains(needs.*.result, 'failure') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {name: config-evidence, path: artifacts/}
      - name: Collect bounded and redacted failure evidence
        env:
          GH_TOKEN: ${{ github.token }}
          POC_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/poc/ci_api.py collect --provider github
      - name: Install report tooling
        if: vars.POC_AI_ENABLED == 'true'
        env:
          POC_AI_PROVIDER: ${{ vars.POC_AI_PROVIDER || 'gemini' }}
        run: |
          if [ "$POC_AI_PROVIDER" = "gemini" ]; then
            bash scripts/bootstrap-agent.sh --renderer-only
          else
            bash scripts/bootstrap-agent.sh
          fi
      - name: Render failure report
        env:
          POC_AI_ENABLED: ${{ vars.POC_AI_ENABLED }}
          POC_LOG_POLICY_APPROVED: ${{ vars.POC_LOG_POLICY_APPROVED }}
          POC_AI_PROVIDER: ${{ vars.POC_AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POC_GEMINI_MODEL: ${{ vars.POC_GEMINI_MODEL }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POC_CODEX_MODEL: ${{ vars.POC_CODEX_MODEL }}
        run: |
          if [ -f .tools/agent.env ]; then source .tools/agent.env; fi
          python scripts/poc/report.py
      - name: Post or update one PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          POC_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/poc/ci_api.py post --provider github --file artifacts/report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-report
          path: artifacts/
          retention-days: 7
